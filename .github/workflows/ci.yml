name: CI

# Restores the verification that was removed in e7323fc. That workflow had gone stale -- Python
# 3.10, flake8, and a requirements-dev.txt that no longer exists -- so this is a fresh one rather
# than a revert.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python — lint, tests, evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Tests
        # The suite imports seven games into a temporary database, so it needs no prebuilt snapshot.
        run: uv run pytest -q
      - name: Build a two-game snapshot
        run: uv run rotom import --db data/build/ci.sqlite3 --games emerald,red
      - name: Integrity and invariants
        run: uv run rotom check --db data/build/ci.sqlite3
      - name: Coverage report is current
        run: |
          uv run rotom coverage --db data/build/ci.sqlite3 --format markdown > /tmp/coverage.md
          test -s /tmp/coverage.md
      - name: Reviewed question set
        run: uv run rotom eval --db data/build/ci.sqlite3

  web:
    name: Web — typecheck and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - run: npm --prefix web run typecheck
      - run: npm --prefix web run test

  e2e:
    name: End to end — desktop and phone
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: uv sync --frozen
      - run: npm --prefix web ci
      - run: npx --prefix web playwright install --with-deps chromium
      # playwright.config.ts starts the server itself: it builds the bundle, imports a two-game
      # database and serves the production arrangement on :8111.
      - run: npm --prefix web run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7

  docker:
    name: Container image builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: rotom-dex:ci
          build-args: ROTOM_GAMES=emerald,red
      - name: The image answers and reports its snapshot
        run: |
          docker run -d --name rotom -p 8000:8000 rotom-dex:ci
          for _ in $(seq 1 30); do
            if curl -fs http://127.0.0.1:8000/health; then break; fi
            sleep 2
          done
          curl -fs http://127.0.0.1:8000/health | tee /dev/stderr | grep -q snapshot_id
          curl -fs "http://127.0.0.1:8000/api/pokemon/ralts?game=emerald" > /dev/null
          docker rm -f rotom
